name: Windows-app bouwen

# Bouwt de R5 StreamerHub-installer (.exe).
# - Op een werkbranch: alleen als workflow-bestand (om te testen).
# - Op main: een openbare release "R5 StreamerHub <versie>" met de .exe, .blockmap en
#   latest.yml. De app leest latest.yml en werkt zichzelf daarmee bij.
#   Elke nieuwe release vraagt dus een hoger versienummer in desktop/package.json;
#   bestaat de versie al, dan wordt er niets gepubliceerd.
on:
  push:
    branches: [main, claude/project-thread-h9pu9f]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: R5-StreamerHub-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          retention-days: 30
      - name: Openbare release maken
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ steps.ver.outputs.v }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Versie $TAG bestaat al; verhoog de versie in desktop/package.json voor een nieuwe release."
            exit 0
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" --latest \
            --title "R5 StreamerHub ${{ steps.ver.outputs.v }}" \
            --notes "Download R5-StreamerHub-Setup-${{ steps.ver.outputs.v }}.exe en voer het uit om de app te installeren. Daarna werkt de app zichzelf bij."
