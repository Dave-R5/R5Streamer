<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R5 StreamerHub overlay</title>
<style>
  /* Doorzichtig: dit is een Browserbron in OBS. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; }
  body.preview { background: repeating-conic-gradient(#202024 0 25%, #18181b 0 50%) 0 0 / 24px 24px; }
  #stage { position: fixed; inset: 0; pointer-events: none; }

  /* emote-wall */
  .em { position: absolute; will-change: transform, opacity; }
  #area { position: absolute; overflow: hidden; }
  @keyframes rise { from { transform: translate(0, 0) rotate(0); opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } to { transform: translate(var(--dx), var(--ty, -110vh)) rotate(var(--rot)); opacity: 0; } }
  @keyframes rain { from { transform: translate(0, 0) rotate(0); opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } to { transform: translate(var(--dx), var(--ty, 115vh)) rotate(var(--rot)); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 15% { transform: scale(1.25); opacity: 1; } 25% { transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { transform: scale(.6); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } to { opacity: 0; } }

  /* emote-combo */
  #combo { position: absolute; display: flex; align-items: center; gap: .25em; color: #fff; font-weight: 800;
    text-shadow: 0 0 8px rgba(0,0,0,.9), 0 3px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .35s; }
  #combo.on { opacity: 1; }
  #combo img { height: 1.6em; }
  #combo .x { font-size: .7em; color: var(--accent); }
  #combo .n { display: inline-block; }
  #combo .n.bump { animation: bump .3s; }
  #combo .lbl { position: absolute; left: 0; right: 0; bottom: -1.1em; font-size: .38em; text-align: center; letter-spacing: .1em; color: #ddd; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .pos-tl { top: 4%; left: 4%; } .pos-tr { top: 4%; right: 4%; } .pos-bl { bottom: 8%; left: 4%; } .pos-br { bottom: 8%; right: 4%; }
  #combo.pos-free { justify-content: center; padding-bottom: .5em; box-sizing: border-box; } #combo.pos-free .lbl { bottom: 0; }
  .pos-c { top: 50%; left: 50%; transform: translate(-50%, -50%); } .pos-tc { top: 4%; left: 50%; transform: translateX(-50%); }

  /* raid melding: staat in zijn eigen vak (box), alle maten schalen mee met de hoogte van dat vak (--u = 1% van de hoogte) */
  #raid { position: absolute; display: flex; align-items: center; gap: calc(var(--u) * 7); padding: calc(var(--u) * 8) calc(var(--u) * 10); box-sizing: border-box;
    border-radius: calc(var(--u) * 11); color: var(--tc); opacity: 0; transition: transform .55s cubic-bezier(.2,1.3,.4,1), opacity .4s; }
  #raid.on { transform: none !important; opacity: 1; }
  #raid.s-card { background: linear-gradient(135deg, var(--accent), #1f1f23 75%); box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.12) inset; }
  #raid.s-banner { border-radius: 0; background: linear-gradient(90deg, transparent, var(--accent) 12%, var(--accent) 88%, transparent); justify-content: center; text-align: center; }
  #raid.s-glass { background: rgba(20,20,24,.45); backdrop-filter: blur(10px); border: 2px solid var(--accent); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #raid.s-text { background: none; justify-content: center; text-align: center; text-shadow: 0 0 10px rgba(0,0,0,.95), 0 3px 0 rgba(0,0,0,.7); }
  #raid.a-pop { transform: scale(.6); } #raid.a-zoom { transform: scale(2.2); } #raid.a-fade { transform: none; }
  #raid.a-top { transform: translateY(-120vh); } #raid.a-bottom { transform: translateY(120vh); }
  #raid.a-left { transform: translateX(-120vw); } #raid.a-right { transform: translateX(120vw); }
  #raid img { height: calc(var(--u) * 78); width: calc(var(--u) * 78); border-radius: 50%; border: calc(var(--u) * 3) solid #fff; background: #000; flex-shrink: 0; object-fit: cover; }
  #raid img.custom { width: auto; max-width: 45%; height: calc(var(--u) * 84); border-radius: calc(var(--u) * 6); border: 0; background: none; object-fit: contain; }
  #raid .txt { min-width: 0; }
  #raid .top { font-size: calc(var(--u) * 12); letter-spacing: .14em; text-transform: uppercase; opacity: .85; font-weight: 700; }
  #raid .name { font-size: calc(var(--u) * 26); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
  #raid .sub { font-size: calc(var(--u) * 13); margin-top: calc(var(--u) * 2); }
  #raid .msg { font-size: calc(var(--u) * 15); font-style: italic; opacity: .92; margin-top: calc(var(--u) * 3); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #raid .rocket { position: absolute; right: calc(var(--u) * -10); top: calc(var(--u) * -18); font-size: calc(var(--u) * 34); animation: fly 1.4s ease-in-out infinite alternate; }
  @keyframes fly { from { transform: translate(0, 0) rotate(-8deg); } to { transform: translate(8px, -10px) rotate(6deg); } }
  /* clip van de raider */
  #clip { position: absolute; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 12px 40px rgba(0,0,0,.55); border: 3px solid var(--accent); opacity: 0; transform: scale(.85); transition: opacity .4s, transform .5s cubic-bezier(.2,1.3,.4,1); }
  #clip.on { opacity: 1; transform: none; }
  #clip iframe, #clip video { width: 100%; height: 100%; border: 0; display: block; object-fit: cover; background: #000; }
  #clip .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd; font-size: 28px; font-weight: 700; background: repeating-linear-gradient(45deg, #26262c 0 18px, #1d1d22 18px 36px); }

  /* gamble (Premium): kaart in een eigen vak (box), maten schalen mee met de hoogte (--u = 1% van de hoogte) */
  #gcard { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--u) * 5) calc(var(--u) * 7); border-radius: calc(var(--u) * 6); background: rgba(24,24,27,.94); color: #fff; border: calc(var(--u) * .9) solid var(--accent);
    box-shadow: 0 12px 40px rgba(0,0,0,.6); font-family: var(--font, inherit); opacity: 0; transform: scale(.7); transition: transform .45s cubic-bezier(.2,1.3,.4,1), opacity .35s, border-color .3s, box-shadow .3s, background .3s; }
  #gcard.on { opacity: 1; transform: none; }
  #gcard .who { display: flex; align-items: center; gap: calc(var(--u) * 3); font-size: calc(var(--u) * 7.5); font-weight: 700; max-width: 100%; }
  #gcard .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gcard .who img { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; background: #333; object-fit: cover; flex-shrink: 0; }
  #gcard .bet { font-size: calc(var(--u) * 5); color: #b8b8c2; margin-top: calc(var(--u) * 1); }
  #gcard .reels { display: flex; gap: calc(var(--u) * 3); margin: calc(var(--u) * 4) 0 calc(var(--u) * 3); }
  #gcard .reel { width: calc(var(--u) * 21); height: calc(var(--u) * 21); border-radius: calc(var(--u) * 4); background: #0e0e10; border: calc(var(--u) * .7) solid #2f2f35; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 13); overflow: hidden; }
  #gcard .reel.spin span { animation: gspin .12s linear infinite; }
  @keyframes gspin { from { transform: translateY(-60%); filter: blur(2px); } to { transform: translateY(60%); filter: blur(2px); } }
  #gcard .reel.stop span { animation: gstop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes gstop { from { transform: translateY(-40%); } to { transform: none; } }
  #gcard .big { font-size: calc(var(--u) * 13); font-weight: 900; letter-spacing: .02em; line-height: 1.05; min-height: 1.05em; opacity: 0; transform: scale(.4); transition: transform .4s cubic-bezier(.2,1.6,.4,1), opacity .25s; }
  #gcard .amt { font-size: calc(var(--u) * 7); font-weight: 800; margin-top: calc(var(--u) * 1.5); opacity: 0; transition: opacity .3s .15s; }
  #gcard .bal { font-size: calc(var(--u) * 4.5); color: #b8b8c2; margin-top: calc(var(--u) * 2); opacity: 0; transition: opacity .3s .3s; }
  #gcard.done .big, #gcard.done .amt, #gcard.done .bal { opacity: 1; transform: none; }
  #gcard.k-win { border-color: #ffd54a; box-shadow: 0 0 calc(var(--u) * 14) rgba(255,213,74,.55), 0 12px 40px rgba(0,0,0,.6); } #gcard.k-win .big, #gcard.k-win .amt { color: #ffd54a; } #gcard.k-win .big { text-shadow: 0 0 calc(var(--u) * 5) #ffb300; } #gcard.k-win .reel { border-color: #ffd54a; }
  #gcard.k-lose { border-color: #ff4d5e; } #gcard.k-lose .big, #gcard.k-lose .amt { color: #ff4d5e; }
  #gcard.k-lose.done { animation: gshake .45s; }
  #gcard.k-bankrupt { border-color: #ff2d2d; background: rgba(42,11,14,.95); } #gcard.k-bankrupt .amt { color: #ff6b6b; }
  #gcard.k-bankrupt.done { animation: gshake .6s; transform: rotate(-3deg); }
  #gcard.k-bankrupt .big { background: #ff2d2d; color: #fff; padding: 0 calc(var(--u) * 4); border-radius: calc(var(--u) * 2); }
  #gcard.k-bankrupt.done .big { transform: rotate(3deg); }
  #gcard.k-bank { border-color: #39d98a; box-shadow: 0 0 calc(var(--u) * 14) rgba(57,217,138,.5), 0 12px 40px rgba(0,0,0,.6); } #gcard.k-bank .big, #gcard.k-bank .amt { color: #39d98a; } #gcard.k-bank .big { font-size: calc(var(--u) * 10.5); }
  @keyframes gshake { 0%, 100% { translate: 0 0; } 15% { translate: calc(var(--u) * -3) 0; } 30% { translate: calc(var(--u) * 3) 0; } 45% { translate: calc(var(--u) * -2) 0; } 60% { translate: calc(var(--u) * 2) 0; } 80% { translate: calc(var(--u) * -1) 0; } }
  #gcard .crack { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; background: repeating-linear-gradient(115deg, transparent 0 calc(var(--u) * 11), rgba(255,45,45,.18) calc(var(--u) * 11) calc(var(--u) * 11.6)); transition: opacity .3s; }
  #gcard.k-bankrupt.done .crack { opacity: 1; }
  #gcard .r5tag { right: calc(var(--u) * 3); bottom: calc(var(--u) * 2); }
  .gcoin { position: absolute; top: -60px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffc107 55%, #b57f00); box-shadow: 0 0 8px rgba(255,179,0,.6); animation: gcoin linear forwards; }
  @keyframes gcoin { to { transform: translateY(120vh) rotate(540deg); } }
  #gbank { position: absolute; padding: 10px 18px; border-radius: 14px; background: rgba(24,24,27,.92); border: 3px solid #39d98a; color: #fff; font: 600 20px/1.2 var(--font, "Segoe UI", system-ui, sans-serif); opacity: 0; transition: opacity .4s, transform .3s; }
  #gbank.on { opacity: 1; } #gbank b { display: block; font-size: 32px; color: #39d98a; } #gbank.bump { transform: scale(1.12); }
  #gfeed { position: absolute; width: 330px; font: 600 18px/1.3 var(--font, "Segoe UI", system-ui, sans-serif); color: #fff; }
  #gfeed div { background: rgba(0,0,0,.72); border-radius: 10px; padding: 6px 12px; margin-top: 6px; transition: opacity .6s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gfeed .w { color: #ffd54a; } #gfeed .l { color: #ff6b6b; } #gfeed .b { color: #39d98a; }

  /* lettertype (Premium) en R5Mod-label (gratis) */
  #raid, #combo { font-family: var(--font, inherit); }
  .r5tag { position: absolute; right: calc(var(--u, 1px) * 6); bottom: calc(var(--u, 1px) * 4); font: 700 calc(var(--u, 1px) * 8)/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .06em; color: #fff; opacity: .7; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
  #r5wall { position: absolute; right: 12px; bottom: 10px; font: 700 14px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .06em; color: #fff; opacity: 0; text-shadow: 0 1px 3px rgba(0,0,0,.8); background: rgba(14,14,16,.45); padding: 4px 8px; border-radius: 6px; transition: opacity .4s; }
  #r5wall.on { opacity: .75; }
  #lock { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 30px/1.4 "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(14,14,16,.85); border: 2px solid #f5c542; border-radius: 16px; padding: 22px 34px; text-align: center; max-width: 70%; }
  #lock b { color: #f5c542; }
  #hint { position: fixed; left: 10px; bottom: 8px; font: 12px system-ui, sans-serif; color: #a0a0ab; background: rgba(14,14,16,.8); padding: 4px 8px; border-radius: 6px; display: none; }
  body.preview #hint { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint"></div>
<script>
(() => {
  'use strict';
  // Instellingen staan in de link, zodat deze pagina zonder login en zonder server werkt.
  // Vaste link: overlay.html?<naam>/<soort> (bijv. ?dave_r5/alerts). De instellingen komen uit de
  // Windows-app op deze pc; verandert er iets, dan wordt de overlay binnen een paar seconden bijgewerkt.
  const fixed = /^\?(\w{2,25})\/(\w{2,20})$/.exec(location.search);
  if (fixed) {
    document.getElementById('stage').remove();
    const hint = document.getElementById('hint');
    const f = document.createElement('iframe');
    f.allow = 'autoplay';
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent';
    document.body.appendChild(f);
    let cur = null;
    const load = async () => {
      try {
        const r = await fetch('http://127.0.0.1:17565/o/' + fixed[1].toLowerCase() + '/' + fixed[2].toLowerCase(), { cache: 'no-store' });
        const q = r.ok ? await r.text() : '';
        if (!q) throw new Error(r.status === 404 ? 'leeg' : 'fout');
        if (q !== cur) { cur = q; f.src = 'overlay.html?' + q; }
        hint.style.display = 'none';
      } catch (e) {
        if (cur == null) { hint.textContent = e.message === 'leeg' ? 'Nog geen instellingen: open Overlays in de R5 StreamerHub-app.' : 'R5 StreamerHub-app niet gevonden: start de app op deze pc.'; hint.style.display = 'block'; }
      }
    };
    load(); setInterval(load, 5000);
    return;
  }
  const P = new URLSearchParams(location.search);
  // Alles-in-één: één OBS-bron met alle gekozen overlays, elk als eigen laag. Elke overlay staat in een
  // eigen parameter o.<soort> (o.wall, o.combo, o.raid, en later nieuwe meldingen), dus nieuwe soorten doen vanzelf mee.
  if (P.get('type') === 'all') {
    document.getElementById('stage').remove(); document.getElementById('hint').remove();
    const frames = [...P.keys()].filter((k) => /^o\.\w+$/.test(k)).map((k, i) => {
      const q = new URLSearchParams(P.get(k));
      q.set('type', k.slice(2)); q.set('ch', P.get('ch') || '');
      ['test', 'hold'].forEach((x) => (P.get(x) ? q.set(x, P.get(x)) : q.delete(x)));
      if (P.get('preview') || P.get('ed')) q.set('ed', '1'); else q.delete('ed');   // voorbeeld in de editor: geen opdrachten uit OBS
      if (P.get('preview') && i === 0) q.set('preview', '1'); else q.delete('preview');   // ruitjes en hint één keer, op de onderste laag
      const f = document.createElement('iframe');
      f.allow = 'autoplay';
      f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent';
      f.src = 'overlay.html?' + q.toString();
      document.body.appendChild(f);
      return f;
    });
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.r5 !== 'test') return;
      frames.forEach((f) => { try { f.contentWindow.postMessage(e.data, location.origin); } catch {} });
    });
    return;
  }
  const FONTS = ['Bangers', 'Luckiest Guy', 'Bebas Neue', 'Montserrat', 'Poppins', 'Fredoka', 'Orbitron', 'Press Start 2P', 'Permanent Marker'];
  const box = (v, d) => { const a = String(v || '').split(',').map(Number); return a.length === 4 && a.every(isFinite) ? a : d; };
  const num = (k, d, lo, hi) => { const v = parseFloat(P.get(k)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  const cfg = {
    type: P.get('type') || 'wall',                     // wall | combo | raid
    ch: (P.get('ch') || '').toLowerCase().replace(/[^a-z0-9_]/g, ''),
    size: num('size', 64, 16, 400),
    dur: num('dur', 6, 1, 60),
    max: num('max', 60, 1, 400),                        // emote-wall: maximaal tegelijk op beeld
    per: num('per', 5, 1, 50),                          // emote-wall: maximaal per bericht
    anim: P.get('anim') || 'rise',                      // rise | rain | pop | bounce
    min: num('min', 3, 2, 100),                         // combo: vanaf hoeveel keer
    win: num('win', 8, 2, 60),                          // combo: seconden tussen twee keer dezelfde emote
    pos: P.get('pos') || 'br',                          // combo: vaste plek of 'free' (eigen vak in cbx)
    zone: P.get('zone') === 'free' ? 'free' : 'full',   // emote-wall: hele scherm of eigen vak (area)
    area: box(P.get('area'), [460, 140, 1000, 800]),
    cbx: box(P.get('cbx'), [1380, 820, 480, 200]),
    sound: ['1', 'chime', 'fanfare'].includes(P.get('sound')) ? (P.get('sound') === 'fanfare' ? 'fanfare' : 'chime') : '',
    vol: num('vol', 50, 0, 100),
    text: P.get('text') || ({ bits: 'gaf {bits} bits!', donation: 'doneerde {amount}!' }[P.get('type')] || '{viewers} kijkers komen binnen!'),
    color: /^[0-9a-f]{6}$/i.test(P.get('color') || '') ? '#' + P.get('color') : '#9147ff',
    test: P.get('test') === '1',
    preview: P.get('preview') === '1',
    off: new Set((P.get('off') || '').split(' ').filter(Boolean)),
    // eigen emotes van de streamer: "naam|link naam|link" (link = https of de Windows-app op 127.0.0.1)
    cem: Object.fromEntries((P.get('cem') || '').split(' ').map((x) => x.split('|')).filter(([n, u]) => /^\w{2,25}$/.test(n || '') && /^(https:\/\/|http:\/\/127\.0\.0\.1:17565\/)/.test(u || ''))),   // emotes die de streamer heeft uitgezet
    imgmode: P.get('imgmode') || 'avatar',              // raid: avatar | custom | none
    style: P.get('style') || 'card',                    // raid: card | banner | glass | text
    title: P.get('title') ?? ({ bits: 'Bits!', donation: 'Donatie!' }[P.get('type')] || 'Raid!'),
    ranim: P.get('ranim') || 'pop',                     // raid: pop | top | bottom | left | right | fade | zoom
    rocket: P.get('rocket') !== '0',
    minamt: num('minamt', 1, 0, 1000000),               // bits/donatie: vanaf dit aantal bits / bedrag
    showmsg: P.get('showmsg') !== '0',                  // bits/donatie: bericht in de melding tonen
    tts: P.get('tts') === '1',                          // bits/donatie: bericht laten voorlezen
    ttslang: /^[a-z]{2}(-[A-Z]{2})?$/.test(P.get('ttslang') || '') ? P.get('ttslang') : 'nl',
    ttsvol: num('ttsvol', 80, 0, 100),
    tcolor: /^[0-9a-f]{6}$/i.test(P.get('tcolor') || '') ? '#' + P.get('tcolor') : '#ffffff',
    box: box(P.get('box'), P.get('type') === 'gamble' ? [660, 250, 600, 440] : [560, 90, 800, 200]),        // raid: plek en grootte van de melding (x,y,b,h op 1920x1080)
    clip: P.get('clip') === '1',
    cbox: box(P.get('cbox'), [1360, 600, 520, 292]),
    clipdur: num('clipdur', 20, 5, 60),
    clipsnd: P.get('clipsnd') !== '0',
    hold: P.get('hold') === '1',                        // editor: melding blijft staan
    img: /^https:\/\//.test(P.get('img') || '') ? P.get('img') : '',
    font: FONTS.includes(P.get('font')) ? P.get('font') : '',   // lettertype (Premium)
    bankpos: ['bl', 'br', 'tl', 'tr', 'off'].includes(P.get('bankpos')) ? P.get('bankpos') : 'bl',   // gamble: plek van de bank-teller
    feed: P.get('feed') !== '0',                       // gamble: laatste uitslagen tonen
  };
  if (cfg.preview) document.body.classList.add('preview');
  const stage = document.getElementById('stage');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- Premium ----------
  // Gratis: emote-wall en meldingen in standaardstijl, met een klein R5Mod-label. Premium (van het kanaal, via r5mod.nl):
  // emote-combo, donatie-melding, eigen kleuren, lettertypes en animaties, en geen label.
  // Het antwoord van r5mod.nl is ondertekend en wordt hier gecontroleerd met de vaste publieke sleutel.
  const PREM_KEY = 'Tikhiac/A6udCP2MSP/4ohtdUs9aURBVnEV+eoZG6+Q=';
  const b64 = (x) => Uint8Array.from(atob(x), (c) => c.charCodeAt(0));
  let naclP = null;
  async function edVerify(sig, msg) {
    try {
      const k = await crypto.subtle.importKey('raw', b64(PREM_KEY), { name: 'Ed25519' }, false, ['verify']);
      return await crypto.subtle.verify('Ed25519', k, sig, msg);
    } catch {
      // oudere browsers (zoals de browserbron in OBS) kennen Ed25519 nog niet: dan met tweetnacl
      naclP = naclP || new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js'; sc.onload = () => ok(window.nacl); sc.onerror = no; document.head.appendChild(sc); });

  const gQ = [];
  let gBusy = false, gBankVal = null;
  const gfmt = (n) => Math.round(n).toLocaleString('nl-NL');
  function gReels(r) {
    if (r.kind === 'bank') return ['🏦', '🏦', '🏦'];
    if (r.kind === 'bankrupt') return ['💣', '💣', '💣'];
    if (r.kind === 'win') { const e = r.mult >= 5 ? '7️⃣' : r.mult >= 3 ? '🍒' : G_FRUIT[Math.floor(Math.random() * G_FRUIT.length)]; return [e, e, e]; }
    const a = G_ALL.slice().sort(() => Math.random() - 0.5);   // verlies: nooit drie dezelfde
    return [a[0], a[1], a[2]];
  }
  function gSound(kind) {
    if (!cfg.sound) return;
    if (kind === 'win' || kind === 'bank') return chime();
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, g = actx.createGain(), o = actx.createOscillator();
      g.connect(actx.destination); o.connect(g); o.type = 'sawtooth';
      g.gain.setValueAtTime(cfg.vol / 100 * .3, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.1);
      o.frequency.setValueAtTime(kind === 'bankrupt' ? 220 : 330, t); o.frequency.exponentialRampToValueAtTime(kind === 'bankrupt' ? 55 : 160, t + 1);
      o.start(t); o.stop(t + 1.1);
    } catch {}
  }
  function gCoins() {
    for (let i = 0; i < 34; i++) {
      const c = document.createElement('div');
      c.className = 'gcoin';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
      c.style.animationDelay = Math.random() * .8 + 's';
      c.onanimationend = () => c.remove();
      stage.appendChild(c);
    }
  }
  function gBank(v, bump) {
    if (v == null || !isFinite(v)) return;
    gBankVal = v;
    if (cfg.bankpos === 'off') return;
    let el = document.getElementById('gbank');
    if (!el) { el = document.createElement('div'); el.id = 'gbank'; el.className = 'pos-' + cfg.bankpos; document.body.appendChild(el); }
    el.innerHTML = '🏦 Bank<b>' + gfmt(v) + '</b>';
    el.classList.add('on');
    if (bump) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 300); }
  }
  function gFeed(r) {
    if (!cfg.feed) return;
    let el = document.getElementById('gfeed');
    if (!el) { el = document.createElement('div'); el.id = 'gfeed'; el.className = 'pos-' + (cfg.bankpos === 'tr' ? 'br' : 'tr'); document.body.appendChild(el); }
    const d = document.createElement('div');
    d.innerHTML = r.kind === 'bank' ? '<span class="b">' + esc(r.name) + '</span> kraakt de bank!' : r.kind === 'win' ? '<span class="w">' + esc(r.name) + '</span> +' + gfmt(r.win)
      : '<span class="l">' + esc(r.name) + '</span> −' + gfmt(r.bet) + (r.kind === 'bankrupt' ? ' 💥' : '');
    el.prepend(d);
    while (el.childElementCount > 3) el.lastElementChild.remove();
    setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 700); }, 30000);
  }
  function gamble(r) { if (!prem) return; gQ.push(r); if (!gBusy) gNext(); }
  async function gNext() {
    const r = gQ.shift();
    if (!r) { gBusy = false; return; }
    gBusy = true;
    let el = document.getElementById('gcard');
    if (el) el.remove();
    el = document.createElement('div'); el.id = 'gcard';
    const [x, y, w, h] = cfg.box;
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    el.style.setProperty('--u', h / 100 + 'px');
    const pname = r.pname || 'punten', reels = gReels(r);
    const av = r.avatar || (r.login ? await avatarOf(r.login) : '');
    el.innerHTML = '<div class="crack"></div><div class="who">' + (av ? '<img src="' + esc(av) + '" alt="">' : '') + '<span>' + esc(r.name) + '</span></div>' +
      '<div class="bet">' + (r.rob ? '🦹 overvalt de bank voor ' : 'zet ') + gfmt(r.bet) + ' ' + esc(pname) + (r.rob ? '' : ' in') + '</div><div class="reels">' + reels.map(() => '<div class="reel spin"><span>' + G_ALL[Math.floor(Math.random() * G_ALL.length)] + '</span></div>').join('') + '</div>' +
      '<div class="big"></div><div class="amt"></div><div class="bal"></div>';
    document.body.appendChild(el);
    el.getBoundingClientRect();
    requestAnimationFrame(() => el.classList.add('on'));
    // rollen draaien en stoppen een voor een
    const rs = [...el.querySelectorAll('.reel')];
    const flick = setInterval(() => rs.forEach((x) => { if (x.classList.contains('spin')) x.firstChild.textContent = G_ALL[Math.floor(Math.random() * G_ALL.length)]; }), 90);
    const hold = cfg.hold;
    const stopAt = hold ? [0, 0, 0] : [900, 1300, 1700];
    rs.forEach((x, i) => setTimeout(() => { x.classList.remove('spin'); x.classList.add('stop'); x.firstChild.textContent = reels[i]; }, stopAt[i]));
    setTimeout(() => {
      clearInterval(flick);
      el.classList.add('k-' + r.kind);
      el.querySelector('.big').textContent = { win: r.mult > 2 ? 'WINST! x' + r.mult : 'WINST!', lose: r.rob ? 'MISLUKT' : 'VERLOREN', bankrupt: 'BANKROET', bank: 'BANK GEKRAAKT!' }[r.kind] || '';
      el.querySelector('.amt').textContent = r.kind === 'win' || r.kind === 'bank' ? '+' + gfmt(r.win) + ' ' + pname : r.kind === 'bankrupt' ? 'alle ' + gfmt(r.bet) + ' ' + pname + ' kwijt' : '−' + gfmt(r.bet) + ' ' + pname;
      el.querySelector('.bal').textContent = 'saldo: ' + gfmt(r.bal) + (r.kind === 'lose' && r.bank != null ? (r.toBank == null ? ' · inzet gaat naar de bank' : r.toBank > 0 ? ' · ' + gfmt(r.toBank) + ' gaat naar de bank' : '') : r.kind === 'bank' ? ' · de bank staat weer op 0' : r.kind === 'bankrupt' ? ' · opnieuw sparen!' : '');
      el.classList.add('done');
      if (!prem) el.insertAdjacentHTML('beforeend', '<span class="r5tag">R5Mod</span>');
      if (hold) { if (r.bank != null) gBank(r.bank); return; }
      gSound(r.kind);
      if (r.kind === 'win' || r.kind === 'bank') gCoins();
      if (r.bank != null) gBank(r.bank, true);
      gFeed(r);
      setTimeout(() => { el.classList.remove('on'); setTimeout(gNext, 600); }, cfg.dur * 1000);
    }, hold ? 50 : 1900);
  }
  const G_TEST = [
    { kind: 'win', name: 'LuckyLars', login: '', bet: 500, win: 1000, mult: 3, bal: 4250, bank: 3200 },
    { kind: 'lose', name: 'PechPetra', login: '', bet: 800, win: -800, mult: 0, bal: 1120, bank: 4000 },
    { kind: 'bankrupt', name: 'AllInAnton', login: '', bet: 3400, win: -3400, mult: 0, bal: 0, bank: 7400 },
    { kind: 'bank', name: 'JackpotJoyce', login: '', bet: 250, win: 7400, mult: 0, bal: 9650, bank: 0 },
    { kind: 'win', name: 'PixelPiet', login: '', bet: 100, win: 100, mult: 2, bal: 600, bank: 0 },
  ];
  let gTestI = 0;
  const gTest = () => gamble(Object.assign({ avatar: TEST_AV }, G_TEST[gTestI++ % G_TEST.length]));

  // ---------- binnenkomende gebeurtenissen ----------
  function onChat(text, emotesTag, user) {
    const list = emotesIn(text, emotesTag);
    if (cfg.type === 'wall') wall(list);
    else if (cfg.type === 'combo') comboMsg(list, user);
  }
  function onRaid(name, viewers, avatar, login, test) { if (cfg.type === 'raid') raid({ name, viewers, avatar: (avatar || '').replace('%s', '300x300'), login: login || '', test }); }
  // profielfoto van een Twitch-naam (openbaar via api.ivr.fi), voor bits en donaties
  async function avatarOf(login) {
    if (!/^\w{2,25}$/.test(login || '')) return '';
    try { const r = await fetch('https://api.ivr.fi/v2/twitch/user?login=' + encodeURIComponent(login)); const j = await r.json(); return ((Array.isArray(j) ? j[0] : j) || {}).logo || ''; } catch { return ''; }
  }
  async function onBits(name, login, bits, msg, test) {
    if (cfg.type !== 'bits' || bits < cfg.minamt) return;
    raid({ name, login, msg, test, avatar: test ? TEST_AV : cfg.imgmode === 'avatar' ? await avatarOf(login) : '', vars: { bits: bits.toLocaleString('nl-NL') } });
  }
  async function onDonation(d, test) {
    if (cfg.type !== 'donation' || d.amount < cfg.minamt || !prem) return;
    const amount = (() => { try { return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: d.cur || 'EUR' }).format(d.amount); } catch { return d.amount + ' ' + (d.cur || ''); } })();
    raid({ name: d.name, login: d.name, msg: d.msg, test, avatar: test ? TEST_AV : cfg.imgmode === 'avatar' ? await avatarOf(String(d.name).toLowerCase()) : '', vars: { amount } });
  }
  // donaties komen van StreamElements/TipeeeStream via de Windows-app op deze pc (de sleutels blijven in de app)
  function pollDonations() {
    let after = null;
    const go = async () => {
      try {
        const r = await fetch('http://127.0.0.1:17565/ev/' + cfg.ch, { cache: 'no-store' });
        const list = r.ok ? await r.json() : [];
        if (after != null) list.filter((d) => d.n > after).forEach((d) => onDonation(d));
        after = list.reduce((m, d) => Math.max(m, d.n), after || 0);
      } catch {}
    };
    go(); setInterval(go, 3000);
  }

  // ---------- chat lezen (anoniem, geen login nodig) ----------
  function parseLine(line) {
    const m = { tags: {}, prefix: '', command: '', params: [] };
    let i = 0;
    if (line[0] === '@') {
      const sp = line.indexOf(' ');
      line.slice(1, sp).split(';').forEach((kv) => {
        const eq = kv.indexOf('=');
        m.tags[kv.slice(0, eq)] = kv.slice(eq + 1).replace(/\\s/g, ' ').replace(/\\:/g, ';').replace(/\\\\/g, '\\');
      });
      i = sp + 1;
    }
    if (line[i] === ':') { const sp = line.indexOf(' ', i); m.prefix = line.slice(i + 1, sp); i = sp + 1; }
    const rest = line.slice(i), ti = rest.indexOf(' :');
    const parts = (ti >= 0 ? rest.slice(0, ti) : rest).split(' ').filter(Boolean);
    m.command = parts.shift(); m.params = parts;
    if (ti >= 0) m.params.push(rest.slice(ti + 2));
    return m;
  }
  let retry = 1000;
  function connect() {
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      retry = 1000;
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('NICK justinfan' + Math.floor(Math.random() * 1e6));
      ws.send('JOIN #' + cfg.ch);
    };
    ws.onmessage = (e) => e.data.split('\r\n').forEach((l) => {
      if (!l) return;
      const m = parseLine(l);
      if (m.command === 'PING') ws.send('PONG :' + (m.params[0] || 'tmi.twitch.tv'));
      else if (m.command === 'ROOMSTATE' && m.tags['room-id']) { loadChannel(m.tags['room-id']); if (m.tags['room-id'] !== premId) checkPrem(m.tags['room-id']); }
      else if (m.command === 'PRIVMSG') {
        let text = m.params[1] || '';
        if (text.startsWith('\u0001ACTION ')) text = text.slice(8, -1);
        onChat(text, m.tags.emotes || '', m.prefix.split('!')[0]);
        if (+m.tags.bits > 0) onBits(m.tags['display-name'] || m.prefix.split('!')[0], m.prefix.split('!')[0], +m.tags.bits, text);
      } else if (m.command === 'USERNOTICE' && m.tags['msg-id'] === 'raid') {
        onRaid(m.tags['msg-param-displayName'] || m.tags['display-name'] || '', +m.tags['msg-param-viewerCount'] || 0, m.tags['msg-param-profileImageURL'] || '', m.tags['msg-param-login'] || m.tags.login || '');
      }
    });
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 30000); };
  }

  // ---------- testen vanuit R5 StreamerHub ----------
  const DEMO_RAIDERS = [['PixelPiet', 42], ['luna_moon', 128], ['Henk_de_Tank', 7]];
  function fakeChat() {
    const names = Object.keys(emo);
    const own = Object.keys(cfg.cem);   // eigen emotes komen in de test vaker langs
    const pick = () => (own.length && Math.random() < .5 ? own[Math.floor(Math.random() * own.length)] : names[Math.floor(Math.random() * Math.min(names.length, 40))]);
    if (cfg.type === 'combo') { const e = combo.name && Math.random() < .85 ? combo.name : pick(); onChat(e + ' ' + e, '', 'test' + Math.floor(Math.random() * 20)); }
    else onChat(Array.from({ length: 1 + Math.floor(Math.random() * 4) }, pick).join(' '), '', 'test');
  }
  // testplaatje: het R5-schild, zodat je ziet waar de profielfoto komt
  const TEST_AV = new URL('icons/icon-192.png', location.href).href;
  function testRaid() {
    const r = DEMO_RAIDERS[Math.floor(Math.random() * DEMO_RAIDERS.length)];
    if (cfg.type === 'raid') onRaid(r[0], r[1], TEST_AV, r[0].toLowerCase(), true);
    if (cfg.type === 'bits') onBits(r[0], r[0].toLowerCase(), Math.max(cfg.minamt, [100, 500, 1000][Math.floor(Math.random() * 3)]), 'Dit is een test van de bits-melding!', true);
    if (cfg.type === 'donation') onDonation({ name: r[0], amount: Math.max(cfg.minamt, [2.5, 5, 10][Math.floor(Math.random() * 3)]), cur: 'EUR', msg: 'Dit is een test van de donatie-melding!' }, true);
  }
  // vaste voorbeeldmelding in de editor
  function sampleAlert() {
    if (cfg.type === 'raid') onRaid('PixelPiet', 42, TEST_AV, 'pixelpiet', true);
    if (cfg.type === 'bits') raid({ name: 'PixelPiet', login: 'pixelpiet', msg: 'Dit is een test van de bits-melding!', test: true, avatar: TEST_AV, vars: { bits: '500' } });
    if (cfg.type === 'donation' && prem) raid({ name: 'PixelPiet', login: 'pixelpiet', msg: 'Dit is een test van de donatie-melding!', test: true, avatar: TEST_AV, vars: { amount: '€ 5,00' } });
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || e.data.r5 !== 'test') return;
    if (GAMBLE) { if (cfg.hold) { cfg.hold = false; gQ.length = 0; gBusy = false; } gTest(); }
    else if (ALERT) { if (cfg.hold) { cfg.hold = false; raidQ.length = 0; raidBusy = false; } testRaid(); }
    else for (let i = 0; i < (cfg.type === 'combo' ? cfg.min + 2 : 8); i++) setTimeout(fakeChat, i * 350);
  });

  const hint = document.getElementById('hint');
  loadGlobal();
  if (cfg.hold && ALERT) sampleAlert();
  else if (cfg.hold && GAMBLE) gTest();
  else if (cfg.test && GAMBLE) { setInterval(() => { if (!gBusy) gTest(); }, (cfg.dur + 3) * 1000); gTest(); }
  else if (cfg.test) {
    setInterval(() => { if (ALERT) { if (!raidBusy) testRaid(); } else fakeChat(); }, ALERT ? (cfg.dur + 3) * 1000 : 900);
    if (ALERT) testRaid();
  }
  if (cfg.ch) connect();
  if (cfg.ch && cfg.type === 'donation' && !cfg.test) pollDonations();
  // 📡 Test live en ▶ opnieuw afspelen: opdrachten van de Windows-app op deze pc (niet in het voorbeeld van de editor)
  if (cfg.ch && !cfg.preview && P.get('ed') !== '1') {
    let after = null;
    const go = async () => {
      try {
        const r = await fetch('http://127.0.0.1:17565/cmd/' + cfg.ch, { cache: 'no-store' });
        const list = r.ok ? await r.json() : [];
        if (after != null) list.filter((c) => c.n > after).forEach((c) => {
          if (c.kind === 'live' && GAMBLE) { const d = c.data || {}; if (c.type === 'gamble') gamble({ kind: String(d.kind || ''), name: String(d.name || ''), login: String(d.login || ''), bet: +d.bet || 0, win: +d.win || 0, mult: +d.mult || 0, bal: +d.bal || 0, bank: d.bank == null ? null : +d.bank, toBank: d.toBank == null ? null : +d.toBank, rob: !!d.rob, pname: String(d.pname || 'punten') }); else if (c.type === 'bank' && prem && +d.bank !== gBankVal) gBank(+d.bank); }
          if (c.kind === 'test' && (c.type === cfg.type || c.type === 'all')) {
            if (GAMBLE) gTest(); else if (ALERT) testRaid(); else for (let i = 0; i < (cfg.type === 'combo' ? cfg.min + 2 : 8); i++) setTimeout(fakeChat, i * 350);
          }
          if (c.kind === 'replay' && c.type === cfg.type) {
            const d = c.data || {};
            if (cfg.type === 'raid') onRaid(d.name || '', +d.viewers || 0, d.avatar || '', d.login || '');
            if (cfg.type === 'bits') onBits(d.name || '', d.login || '', +d.bits || 0, d.msg || '');
            if (cfg.type === 'donation') onDonation({ name: d.name || 'iemand', amount: +d.amount || 0, cur: d.cur || 'EUR', msg: d.msg || '' });
          }
        });
        after = list.reduce((m, c) => Math.max(m, c.n), after || Date.now() - 1);
      } catch { if (after == null) after = Date.now() - 1; }
    };
    go(); setInterval(go, 1500);
  }
  hint.textContent = cfg.ch ? 'Voorbeeld: luistert naar de chat van ' + cfg.ch : 'Voorbeeld (nog geen kanaal ingevuld)';
})();
</script>
</body>
